services:
  postgres:
    image: postgres:14-alpine
    container_name: planning_console_postgres
    environment:
      POSTGRES_DB: planning_console
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - planning_console_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: planning_console_neo4j
    environment:
      NEO4J_AUTH: neo4j/planning_console_neo4j_2024
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_default__database: pc-neo4j-poc
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - planning_console_network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "planning_console_neo4j_2024", "-d", "pc-neo4j-poc", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - postgres

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:

networks:
  planning_console_network:
    driver: bridge

